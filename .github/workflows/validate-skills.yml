name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "agents/**"
      - "scripts/**"
      - "tests/**"
      - "plugin.json"
      - ".*-plugin/**"
      - ".agents/plugins/**"
      - ".pi/**"
      - ".opencode/**"
      - ".cline/**"
      - ".agy/**"
      - "hooks/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run

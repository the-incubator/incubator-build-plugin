name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate-skills.mjs"
      # validate-skills.mjs imports this parser to assert the PR-workflow skill's
      # name stays the canonical form the gate reads, so a change to it must
      # re-run validation too.
      - "hooks/pr-workflow-skill.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - run: npm run test:skills
